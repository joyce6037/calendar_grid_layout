[project]
name = "calendar-grid-layout"
version = "0.1.1"
description = "Generates a month calendar as a multi-line grid string with blank cells for dates outside the target month."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
